	    <p>
            RegisterNetDll 은 AnyCPU로 컴파일 되었다.</p>
        <p>
            엑셀 리포터는 32비트 64비트 자동으로 설치된다.</p>
        <p>
            64비트에 32비트 오피스를 사용하면 오토베이스 설치 후 RegisterNetDll32를 실행하면 자동으로 등록된다.</p>
        <p>
            AnyCPU로 컴파일된 어셈블리는
            <a href="file:///C:/Windows/Microsoft.NET/Framework64/V2.0.50727/RegAsm.exe">
            C:\Windows\Microsoft.NET\Framework64\V2.0.50727\RegAsm.exe</a> 로 등록해도 된다.</p>
